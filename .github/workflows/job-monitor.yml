name: Job Monitor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Tests
        run: python3 -m unittest -v
      - name: Check report password
        env:
          REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
        run: |
          test "${#REPORT_PASSWORD}" -ge 24 || { echo 'Set REPORT_PASSWORD (at least 24 characters)'; exit 1; }
      - name: Search and report
        env:
          SUPERJOB_API_KEY: ${{ secrets.SUPERJOB_API_KEY }}
        run: python3 job_monitor.py
      - name: Encrypt report
        env:
          REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          7z a -t7z -mhe=on -p"$REPORT_PASSWORD" report.7z ./private-report >/dev/null
          7z t -p"$REPORT_PASSWORD" report.7z >/dev/null
          rm -rf private-report
      - name: Upload encrypted report
        uses: actions/upload-artifact@v4
        with:
          name: job-monitor-encrypted
          path: report.7z
          retention-days: 3
          if-no-files-found: error
