name: Job Monitor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Tests
        run: python3 -m unittest -v
      - name: API diagnostics
        env:
          SUPERJOB_API_KEY: ${{ secrets.SUPERJOB_API_KEY }}
        run: python3 diagnostic.py
      - name: Search and report
        env:
          SUPERJOB_API_KEY: ${{ secrets.SUPERJOB_API_KEY }}
          SEND_MAIL: '0'
        run: python3 job_monitor.py
